services:
  # 1. Database: PostgreSQL tích hợp pgvector cho việc tìm kiếm đặc trưng vector (Re-ID)
  db:
    image: pgvector/pgvector:pg16
    container_name: mct-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # LƯU Ý: Đổi thành "5435:5432" để tránh xung đột cổng 5432 với PostgreSQL chạy local của máy Host.
      # Bên trong các container vẫn kết nối qua cổng 5432 bình thường.
      - "5435:5432"
    restart: always

  # 2. Object Storage: MinIO lưu trữ video, calibrations, snapshots và thumbnails
  minio:
    image: minio/minio:latest
    container_name: mct-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      # LƯU Ý: Nếu cổng 9000 hoặc 9001 trên máy bạn đã bị chiếm,
      # bạn hãy dừng dịch vụ local đó trước khi khởi động docker compose.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  minio_data:

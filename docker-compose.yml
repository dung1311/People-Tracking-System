services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./be
    container_name: datn-backend
    volumes:
      - ./be/data:/app/data
      - ./be/configs:/app/configs
      - ./be/logs:/app/logs
      # Map weights if needed
      - ./be/yolo11n.pt:/app/yolo11n.pt
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_SECURE: "False"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  minio:
    image: minio/minio
    container_name: mct-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  frontend:
    build:
      context: ./fe
    container_name: datn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:

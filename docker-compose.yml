version: '3.8'

services:
  # 1. Database: PostgreSQL with pgvector for Re-ID vector searches
  db:
    image: pgvector/pgvector:pg16
    container_name: mct-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: always

  # 2. Object Storage: MinIO for videos, calibrations, snapshots, and thumbnails
  minio:
    image: minio/minio:latest
    container_name: mct-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # 3. Backend: FastAPI Application
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: mct-backend
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=db
      - DB_HOST=db
      - DB_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_SECURE=false
      - MINIO_BUCKET=tracking
      - SECRET_KEY=change-me-in-production-please
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=admin123
      - DEFAULT_ADMIN_EMAIL=admin@localhost
    ports:
      - "8000:8000"
    volumes:
      - ./be/weights:/app/weights
      - ./be/data:/app/data
      - ./be/outputs:/app/outputs
      - ./be/src:/app/src
      - ./be/configs:/app/configs
    depends_on:
      - db
      - minio
    restart: always

  # 4. Frontend: React Application served via Nginx (Single Entrypoint)
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: mct-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  minio_data:
